name: Daily Parser Health Check

on:
  schedule:
    # UTC 07:00 = 北京时间 15:00
    - cron: '0 7 * * *'
  workflow_dispatch: # 支持在 GitHub Actions 页面手动触发

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger remote health check API (if HEALTH_CHECK_URL is configured)
        if: ${{ vars.HEALTH_CHECK_URL != '' }}
        env:
          HEALTH_CHECK_URL: ${{ vars.HEALTH_CHECK_URL }}
        run: |
          echo "Calling $HEALTH_CHECK_URL"
          curl -fsS --max-time 60 "$HEALTH_CHECK_URL"

      - name: Checkout repository (fallback local run)
        if: ${{ vars.HEALTH_CHECK_URL == '' }}
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: ${{ vars.HEALTH_CHECK_URL == '' }}
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        if: ${{ vars.HEALTH_CHECK_URL == '' }}
        run: npm ci --omit=dev || npm install --omit=dev

      - name: Run health check and send email report
        if: ${{ vars.HEALTH_CHECK_URL == '' }}
        run: node -e "require('./src/utils/healthCheck').runHealthCheckAndNotify().catch((e) => { console.error(e); process.exit(1) })"
